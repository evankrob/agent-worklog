<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Log</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f1eb; color: #1c1b19; }
  main { max-width: 420px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #6f6c66; line-height: 1.45; }
  a { color: #1d4f91; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Work Log</h1>
  <p id="status">Opening your local work log…</p>
  <div id="offline" hidden>
    <p>The local server is not running. Start it, then open this tab again.</p>
    <p><code>python -m worklog serve</code></p>
    <p><a id="open" href="http://127.0.0.1:8731/">http://127.0.0.1:8731/</a></p>
  </div>
</main>
<script src="newtab.js"></script>
</body>
</html>
