<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Log options</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f1eb; color: #1c1b19; }
  main { padding: 16px; min-width: 280px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { font-size: 13px; color: #6f6c66; margin: 0 0 10px; }
  label { font-size: 12px; display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d9d3c6; border-radius: 8px; font: inherit; }
  button { margin-top: 10px; border: 0; background: #1c1b19; color: #f3f1eb; border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #msg { min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>Work Log</h1>
  <p>New tabs open this local URL. Only 127.0.0.1 and localhost are accepted.</p>
  <label for="url">Dashboard URL</label>
  <input id="url" type="url" spellcheck="false" value="http://127.0.0.1:8731/">
  <button type="button" id="save">Save</button>
  <p id="msg"></p>
</main>
<script src="options.js"></script>
</body>
</html>
