<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client B — sample landing page</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #f4f1ea; color: #1c1b19; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  p.kicker { letter-spacing: .14em; text-transform: uppercase; font-family: system-ui, sans-serif; font-size: 12px; color: #8a5a00; }
  h1 { font-size: 40px; line-height: 1.15; font-weight: 500; }
  form { display: flex; gap: 8px; margin-top: 28px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; }
  input { flex: 1; border: 1px solid #d9d3c6; }
  button { background: #1c1b19; color: #f4f1ea; border: 0; }
  .count { margin-top: 28px; font-family: system-ui, sans-serif; color: #6f6c66; }
</style>
</head>
<body>
<main>
  <p class="kicker">Client B · sample</p>
  <h1>Open the shop before the season does.</h1>
  <p>A fictional landing page with a lead form and a countdown. Nothing here is a real product.</p>
  <form action="#" method="get">
    <input type="email" name="email" placeholder="you@example.com" aria-label="Email">
    <button type="submit">Request a note</button>
  </form>
  <p class="count">Launch countdown is a placeholder. It does not track anyone.</p>
</main>
</body>
</html>
